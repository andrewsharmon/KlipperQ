# Minimal host configuration for STM32U585 communication bring-up.
# No printer outputs, heaters, sensors, or motion channels are configured.

[mcu]
serial: /dev/ttyHS1
baud: 115200

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

[virtual_sdcard]
path: /home/arduino/printer_data/gcodes

[display_status]

[pause_resume]

[respond]
